<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#010611" />
  <title>PlotCue</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #010611;
      --panel: #210a10;
      --gold: #d3a136;
      --gold-light: #f0c968;
      --text: #f5f0e8;
      --muted: #a9a39a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(211,161,54,.10), transparent 38%),
        linear-gradient(180deg, #06101c 0%, var(--bg) 55%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      padding: 24px;
    }
    main {
      width: min(560px, 100%);
      padding: 40px 30px;
      border: 1px solid rgba(211,161,54,.8);
      border-radius: 24px;
      background: rgba(33,10,16,.96);
      box-shadow: 0 24px 70px rgba(0,0,0,.45);
      text-align: center;
    }
    .mark {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold-light);
      font-size: 32px;
      font-weight: 900;
    }
    .brand {
      margin: 0;
      color: var(--gold-light);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .22em;
    }
    h1 {
      margin: 12px 0 12px;
      font-size: clamp(28px, 6vw, 40px);
      line-height: 1.08;
    }
    p {
      margin: 0 auto;
      max-width: 430px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }
    .note {
      margin-top: 22px;
      color: var(--text);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark">✓</div>
    <p class="brand">PLOTCUE</p>
    <h1>Email confirmed</h1>
    <p>Your email address has been verified successfully.</p>
    <p class="note">You can now return to PlotCue and sign in.</p>
  </main>
</body>
</html>
